<div id="credit-layout">
<style>
#credit-layout{--ink:#17141f;--soft:#403a49;--line:#e6e4ed;--purple:#56318c;--pale:#f2edf8;--paper:#fff;background:var(--paper);color:var(--ink);font:14px/1.45 Arial,sans-serif;border:1px solid var(--line);border-radius:6px;overflow:hidden}
#credit-layout *{box-sizing:border-box}#credit-layout button{font:inherit;color:inherit;background:white;border:1px solid var(--line);padding:7px 11px;border-radius:3px}#credit-layout button:disabled{opacity:.4}#credit-layout .top{display:flex;justify-content:space-between;gap:15px;padding:19px 22px 12px;flex-wrap:wrap}#credit-layout .brand{font-size:18px;font-weight:600}#credit-layout .small{font-size:12px;color:var(--soft)}#credit-layout .top .small{padding-right:75px}#credit-layout .nav{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 14px}#credit-layout .nav button{border:0;border-radius:0;padding:12px 10px;border-bottom:3px solid transparent}#credit-layout .nav button[aria-selected=true]{color:var(--purple);border-color:var(--purple);background:var(--pale)}#credit-layout .context{display:flex;gap:20px;padding:10px 22px;background:#faf9fc;border-bottom:1px solid var(--line);font-size:12px;flex-wrap:wrap}#credit-layout .viewport{overflow:hidden}#credit-layout .track{display:flex;transition:transform .35s ease;align-items:flex-start}#credit-layout .screen{flex:0 0 100%;min-width:0;padding:18px 22px}#credit-layout h2{font-size:17px;margin:0 0 12px;font-weight:600}#credit-layout h3{font-size:13px;margin:0 0 12px;font-weight:600}#credit-layout .metrics{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}#credit-layout .metric{padding:11px 10px;border-right:1px solid var(--line)}#credit-layout .metric:last-child{border:0}#credit-layout .value{display:block;font-size:23px;margin-top:4px;font-variant-numeric:tabular-nums}#credit-layout .grid{display:grid;grid-template-columns:1.65fr 1fr;gap:16px}#credit-layout .panel{border:1px solid var(--line);padding:13px;min-width:0;border-radius:3px}#credit-layout .bottom{margin-top:16px}#credit-layout svg{display:block;width:100%;height:auto}#credit-layout svg text{font:12px Arial;fill:var(--soft)}#credit-layout table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}#credit-layout td,#credit-layout th{padding:9px 7px;text-align:right;border-bottom:1px solid var(--line);font-weight:400}#credit-layout td:first-child,#credit-layout th:first-child{text-align:left}#credit-layout th{color:var(--soft)}#credit-layout .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 22px}#credit-layout .foot div{display:flex;gap:8px}#credit-layout .legend{display:flex;gap:15px;font-size:12px;color:var(--soft);margin:8px 0 0}#credit-layout .legend span:before{content:'';display:inline-block;width:14px;height:3px;background:var(--purple);vertical-align:middle;margin-right:5px}#credit-layout .legend span+span:before{background:#b6a4ce}#credit-layout .heat{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:12px;text-align:center}#credit-layout .heat div{padding:10px 3px;background:var(--pale)}#credit-layout .heat .label{background:transparent;color:var(--soft)}#credit-layout .design-note{padding:10px 22px;border-top:1px solid var(--line);font-size:12px;color:var(--soft);background:#faf9fc}
@media(max-width:650px){#credit-layout .grid{grid-template-columns:1fr}#credit-layout .metrics{grid-template-columns:repeat(2,1fr)}#credit-layout .screen{padding:14px}#credit-layout .value{font-size:20px}#credit-layout .top{padding:14px}#credit-layout .nav button{padding:10px 8px}#credit-layout .context{gap:10px}}
@media(prefers-reduced-motion:reduce){#credit-layout .track{transition:none}}

#credit-layout{color-scheme:light;border-radius:2px}
#credit-layout .top{padding:13px 20px 9px;flex-wrap:nowrap}
#credit-layout .top>div:first-child{max-width:75%}
#credit-layout .top .small{padding-right:0;max-width:680px;margin-top:4px}
#credit-layout .top>div:last-child{padding-right:80px;white-space:nowrap}
#credit-layout .nav{padding:0 12px;display:flex;flex-wrap:wrap}
#credit-layout .nav button{padding:9px 12px;opacity:1;font-weight:500}
#credit-layout .nav button[aria-pressed=true]{background:#eee6f7;color:#402068;border-bottom-color:#56318c}
#credit-layout .track{display:block;transform:none;transition:none}
#credit-layout .screen{width:100%;padding:12px 20px}
#credit-layout .screen[hidden]{display:none!important}
#credit-layout h2{margin-bottom:8px}
#credit-layout .metrics{margin-bottom:12px;background:#faf8fd}
#credit-layout .metric{padding:8px 12px}
#credit-layout .value{color:#17141f;font-weight:600;margin-top:2px}
#credit-layout .small,#credit-layout th,#credit-layout .legend{color:#403a49}
#credit-layout .grid{grid-template-columns:1.3fr 1fr;gap:12px}
#credit-layout .panel{padding:10px 12px}
#credit-layout h3{color:#21162e;margin-bottom:8px}
#credit-layout svg{height:185px;width:100%}
#credit-layout svg text{fill:#2e2638;font-size:14px;font-weight:500}
#credit-layout .bottom{margin-top:12px}
#credit-layout td,#credit-layout th{padding:7px;font-size:12px;color:#272130}
#credit-layout .heat div{padding:8px 3px;font-weight:500}
#credit-layout .heat .label{color:#302738}
#credit-layout .foot{padding:7px 20px}
#credit-layout .legend span+span:before{background:#8462ad}
@media(max-width:650px){#credit-layout .top{flex-wrap:wrap}#credit-layout .top>div:first-child{max-width:100%}#credit-layout .top>div:last-child{padding-right:0}#credit-layout .grid{grid-template-columns:1fr}#credit-layout .metrics{grid-template-columns:repeat(2,1fr)}#credit-layout .heat{font-size:11px}#credit-layout td,#credit-layout th{padding:5px 2px;font-size:11px}}
</style>
<div class="top"><div><div class="brand">The Credit Trade-off</div><div class="small">A project built to demonstrate my understanding of credit analytics and how I approach lending decisions.</div></div><div class="small">Illustrative values<br>Independent portfolio project</div></div>
<div class="nav" role="group" aria-label="Credit workspaces"></div>
<div class="context"><span>Observation date <strong>30 Sep 2026</strong></span><span>Product <strong>Personal loans</strong></span><span>Population <strong>All borrowers</strong></span><span>Data <strong>Synthetic</strong></span></div>
<div class="viewport"><div class="track"></div></div>
<div class="foot"><span class="small" aria-live="polite" id="credit-position">1 / 6 · Portfolio</span><div><button type="button" class="prev" aria-label="Previous workspace">←</button><button type="button" class="next" aria-label="Next workspace">→</button></div></div>

<script>
(()=>{
const root=document.getElementById('credit-layout');
const purple='#56318c', pale='#8462ad';
const svg=(body,label)=>`<svg viewBox="0 0 500 225" role="img" aria-label="${label}">${body}</svg>`;
function lines(series,labels=['Apr','May','Jun','Jul','Aug','Sep'],unit='%'){
 const max=Math.max(...series.flat())*1.2; let s='';
 for(let i=0;i<4;i++){let y=180-i*50;s+=`<line x1="48" y1="${y}" x2="474" y2="${y}" stroke="#eceaf0"/><text x="40" y="${y+4}" text-anchor="end">${(i*max/3).toFixed(max>30?0:1)}</text>`;}
 series.forEach((a,j)=>{let pts=a.map((v,i)=>`${48+i*426/(a.length-1)},${180-v/max*150}`).join(' ');s+=`<polyline points="${pts}" fill="none" stroke="${j?pale:purple}" stroke-width="2.5"/>`;});
 labels.forEach((v,i)=>s+=`<text x="${48+i*426/(labels.length-1)}" y="202" text-anchor="middle">${v}</text>`);s+=`<text x="48" y="15">${unit}</text>`;return svg(s,'Illustrative trend chart');
}
function bars(names,values,unit){const max=Math.max(...values)*1.12;return svg(names.map((n,i)=>{let y=25+i*35;return `<text x="125" y="${y+13}" text-anchor="end">${n}</text><rect x="138" y="${y}" width="${values[i]/max*285}" height="19" fill="${purple}" opacity="${1-i*.1}"/><text x="${145+values[i]/max*285}" y="${y+14}">${values[i]}${unit}</text>`;}).join(''),'Illustrative comparison chart');}
function table(headers,rows){return `<table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
function heat(rowNames,cols,values){return `<div class="heat" style="grid-template-columns:90px repeat(${cols.length},1fr)"><div class="label"></div>${cols.map(c=>`<div class="label">${c}</div>`).join('')}${rowNames.map((r,i)=>`<div class="label">${r}</div>${values[i].map(v=>`<div style="background:rgba(86,49,140,${v===null?0:.08+v/100*.7});color:${v>60?'white':'#20202b'}">${v===null?'—':v+'%'}</div>`).join('')}`).join('')}</div>`;}
const panel=(title,body)=>`<section class="panel"><h3>${title}</h3>${body}</section>`;
const legend='<div class="legend"><span>Baseline</span><span>Proposed</span></div>';
const pages=[
 {name:'Portfolio',metrics:[['Outstanding principal','₦428m'],['30+ DPD balance','5.8%'],['Monthly disbursements','₦186m'],['Annualised net loss','8.4%']],a:['Outstanding principal',lines([[305,328,346,380,402,428]],undefined,'₦m')],b:['Delinquency · % of balance',bars(['Current','1–29 days','30–59 days','60–89 days','90+ days'],[87.3,6.9,3.1,1.6,1.1],'%')],c:['Segment performance',table(['Segment','Loans','Balance','30+ DPD','Net loss / avg balance'],[['First loan','2,140','₦164m','7.6%','0.91%'],['Repeat borrower','3,820','₦264m','4.7%','0.55%']])],note:'Select a month or segment to cross-filter. The observation date stays visible.'},
 {name:'Approvals',metrics:[['Baseline approval','46.2%'],['Proposed approval','49.8%'],['Expected loss / lent','2.9%'],['Proposed score cut-off','620']],a:['Approval–loss trade-off',lines([[1.4,1.7,2.0,2.5,3.2,4.1]],['30%','35%','40%','45%','50%','55%'],'Expected loss / lent (%)')],b:['Decision outcomes',bars(['Applied','Eligible','Approved','Accepted','Disbursed'],[100,76,46.2,41.5,40.8],'%')],c:['Policy comparison',table(['Rule','Baseline','Proposed','Change'],[['Score cut-off','640','620','−20'],['Repayment / income ceiling','25%','25%','—'],['Approval rate','46.2%','49.8%','+3.6 pp'],['Expected loss / lent','2.5%','2.9%','+0.4 pp']])],note:'Drag the score cut-off in the build. A saved proposal carries into Affordability and Profitability.'},
 {name:'Affordability',metrics:[['Median assigned amount','₦78,000'],['Median repayment / income','18.6%'],['Affordability declines','12.4%'],['Maximum loan amount','₦150,000']],a:['Income and monthly repayment',svg(Array.from({length:65},(_,i)=>{let x=70+(i*67%395),y=171-(x-70)*.26+(i*19%65)-30;return `<circle cx="${x}" cy="${y}" r="3" fill="${purple}" opacity=".8"/>`;}).join('')+'<line x1="55" y1="183" x2="475" y2="183" stroke="#d0ccd8"/><line x1="55" y1="20" x2="55" y2="183" stroke="#d0ccd8"/><text x="260" y="218" text-anchor="middle">Monthly income (₦000) · 100–600</text><text x="60" y="14">Monthly repayment (₦000) · 0–150</text>','Illustrative affordability scatterplot')],b:['Assigned loan amounts',bars(['≤ ₦30k','₦30k–60k','₦60k–90k','₦90k–120k','₦120k–150k'],[12,24,31,21,12],'%')],c:['Borrower review',table(['Borrower','Income / month','Existing repayments','Proposed repayment','Decision'],[['SYN-0142','₦240,000','₦16,000','₦35,000','Pass'],['SYN-0286','₦150,000','₦22,000','₦24,000','Reduce amount'],['SYN-0318','₦320,000','₦30,000','₦44,000','Pass']])],note:'Select borrowers for a repayment breakdown. Income and existing obligations determine affordability; the score alone does not.'},
 {name:'Vintages',metrics:[['MOB 3 · 30+ ever DPD','7.1%'],['Current → 1–29 DPD','4.8%'],['1–29 → current','58.0%'],['Observation window','6 months']],a:['Ever 30+ DPD · origination cohorts',lines([[0,1.6,3.4,5.2,6.3,6.8],[0,1.9,4.1,6.1,7.0,7.5]],['0','1','2','3','4','5'],'% of originated loans')+'<div class="legend"><span>April cohort</span><span>May cohort</span></div>'],b:['30+ DPD by month on book',heat(['April','May','June','July'],['M0','M1','M2','M3','M4'],[[0,1.6,3.4,5.2,6.3],[0,1.9,4.1,6.1,7],[0,2,4.8,7.1,null],[0,2.4,5.2,null,null]])],c:['Monthly roll rates · % of opening accounts',heat(['Current','1–29','30–59'],['Current','1–29','30–59','60+','Closed'],[[91,4.8,0,0,4.2],[58,20,17,0,5],[16,12,24,43,5]])],note:'Compare cohorts at the same month on book. Unobserved cells remain blank; monthly transitions animate only on Play.'},
 {name:'Collections',metrics:[['Randomised borrowers','2,400'],['Control cure rate','32.0%'],['Treatment cure rate','36.2%'],['Difference','+4.2 pp']],a:['Cumulative cure rate · 14-day experiment',lines([[0,8,15,22,28,32],[0,10,19,27,33,36.2]],['0','3','6','9','12','14'],'Cured borrowers (%)')+legend.replace('Baseline','Control').replace('Proposed','Treatment')],b:['Cure-rate difference · 95% interval',svg('<line x1="70" y1="100" x2="450" y2="100" stroke="#e6e4ed"/><line x1="133" y1="45" x2="133" y2="157" stroke="#d0ccd8"/><line x1="183" y1="100" x2="350" y2="100" stroke="#56318c" stroke-width="3"/><circle cx="267" cy="100" r="5" fill="#56318c"/><text x="70" y="184">−2</text><text x="130" y="184">0</text><text x="260" y="184">4.2</text><text x="435" y="184">10</text><text x="250" y="211" text-anchor="middle">Percentage points</text>','Illustrative confidence interval from 0.4 to 8.0 percentage points')],c:['Experiment results',table(['Arm','Borrowers','Cured','Cure rate'],[['Control','1,200','384','32.0%'],['Treatment','1,200','434','36.2%']])],note:'Use borrower-level randomisation, a fixed observation period and intention-to-treat analysis. All results here are illustrative.'},
 {name:'Profitability',metrics:[['Forecast horizon','6 months'],['Baseline contribution','₦24.8m'],['Proposed contribution','₦27.1m'],['Difference','+₦2.3m']],a:['Monthly contribution forecast',lines([[3.8,4,4.1,4.2,4.3,4.4],[3.8,4.2,4.5,4.7,4.9,5]],['Oct','Nov','Dec','Jan','Feb','Mar'],'₦m')+legend],b:['Contribution bridge · ₦m',bars(['Interest + fees','Funding cost','Credit losses','Servicing','Collections'],[58,12,11,5,2.9],'')],c:['Scenario comparison',table(['Scenario','Income','Losses','Other costs','Contribution'],[['Baseline','₦52.0m','₦9.8m','₦17.4m','₦24.8m'],['Proposed','₦58.0m','₦11.0m','₦19.9m','₦27.1m'],['Stress','₦54.0m','₦15.0m','₦20.5m','₦18.5m']])],note:'Forecasts use the saved policy proposal. Show uncertainty and stress cases; contribution excludes tax and unallocated corporate overhead.'}
];
const nav=root.querySelector('.nav'),track=root.querySelector('.track');
pages.forEach((p,i)=>{let b=document.createElement('button');b.type='button';b.id='credit-tab-'+i;b.setAttribute('aria-controls','credit-screen-'+i);b.textContent=`${i+1}. ${p.name}`;b.addEventListener('click',()=>show(i));nav.appendChild(b);let section=document.createElement('section');section.className='screen';section.id='credit-screen-'+i;section.setAttribute('role','region');section.setAttribute('aria-labelledby',b.id);section.innerHTML=`<h2>${p.name}</h2><div class="metrics">${p.metrics.map(m=>`<div class="metric"><span class="small">${m[0]}</span><span class="value">${m[1]}</span></div>`).join('')}</div><div class="grid">${panel(...p.a)}${panel(...p.b)}</div><div class="bottom">${panel(...p.c)}</div>`;track.appendChild(section);});
let active=0;function show(i){active=i;track.style.transform='none';[...nav.children].forEach((b,j)=>b.setAttribute('aria-pressed',String(j===i)));[...track.children].forEach((p,j)=>{p.hidden=j!==i;p.style.display=j===i?'block':'none';p.setAttribute('aria-hidden',String(j!==i));});root.querySelector('#credit-position').textContent=`${i+1} / 6 · ${pages[i].name}`;root.querySelector('.prev').disabled=i===0;root.querySelector('.next').disabled=i===5;requestAnimationFrame(()=>root.querySelector('.viewport').style.height=track.children[i].offsetHeight+'px');}
root.querySelector('.prev').addEventListener('click',()=>show(Math.max(0,active-1)));root.querySelector('.next').addEventListener('click',()=>show(Math.min(5,active+1)));nav.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();show((active+(e.key==='ArrowRight'?1:5))%6);nav.children[active].focus();}});new ResizeObserver(()=>{root.querySelector('.viewport').style.height=track.children[active].offsetHeight+'px';}).observe(root);show(0);
})();
</script>
</div>
